<section
    class="selector-bar"
    data-page-id="{{ page_id }}"
    data-selector-type="assignment-class"
>

    <div class="selector-group">
        <label class="selector-label">Class sort</label>
        <select class="selector-select" data-role="class-sort">
            {% include "partials/selector/_class_sort_options.html" %}
        </select>
    </div>

    <div class="selector-group">
        <label class="selector-label">Class status</label>
        <select class="selector-select" data-role="class-status">
            <option value="all">All</option>
            <option value="in_progress">In progress</option>
            <option value="finished">Finished</option>
        </select>
    </div>

    <div class="selector-group wide">
        <span class="selector-label">Importance</span>
        <div class="selector-checks">
            {% for level in ["high","medium","low"] %}
            <label class="selector-check">
                <input type="checkbox" value="{{ level }}" checked>
                {{ level|capitalize }}
            </label>
            {% endfor %}
        </div>
    </div>

    <div class="selector-group wide">
        <span class="selector-label">Class type</span>
        <div class="selector-checks grid">
            {% for ct in class_types %}
            <label class="selector-check">
                <input type="checkbox" name="class_type_selector" value="{{ ct.value }}">
                {{ ct.label }}
            </label>
            {% endfor %}
        </div>
    </div>

    <div class="selector-actions stacked">
        <button class="full-btn" data-action="apply">
            Apply filters
        </button>
        <div class="row">
            <button class="btn-tiny" data-action="reset-system">Reset system filters</button>
            <button class="btn-tiny ghost-btn" data-action="reset-personal">Reset personal filters</button>
        </div>
    </div>

</section>
