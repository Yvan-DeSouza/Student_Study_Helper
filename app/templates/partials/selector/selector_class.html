<section
    class="selector-bar"
    data-page-id="{{ page_id }}"
    data-selector-type="class"
>

    <!-- Sort -->
    <div class="selector-group">
        <label class="selector-label">Sort by</label>
        <select class="selector-select" data-role="sort">
            <option value="name_asc">Name (A → Z)</option>
            <option value="name_desc">Name (Z → A)</option>
            <option value="importance_high_low">Importance (High → Low)</option>
            <option value="importance_low_high">Importance (Low → High)</option>
            <option value="difficulty_high_low">Difficulty (High → Low)</option>
            <option value="difficulty_low_high">Difficulty (Low → High)</option>
            <option value="grade_high_low">Grade (High → Low)</option>
            <option value="grade_low_high">Grade (Low → High)</option>
            <option value="created_newest">Newest</option>
            <option value="created_oldest">Oldest</option>
        </select>
    </div>

    <!-- Status -->
    <div class="selector-group">
        <label class="selector-label">Status</label>
        <select class="selector-select" data-role="status">
            <option value="all">All</option>
            <option value="in_progress">In Progress</option>
            <option value="finished">Finished</option>
        </select>
    </div>

    <!-- Importance -->
    <div class="selector-group wide">
        <span class="selector-label">Importance</span>
        <div class="selector-checks">
            {% for level in ["high","medium","low","none"] %}
            <label class="selector-check">
                <input type="checkbox" value="{{ level }}" {% if level != "none" %}checked{% endif %}>
                {{ level|capitalize if level != "none" else "None / Unset" }}
            </label>
            {% endfor %}
        </div>
    </div>

    <!-- Class types -->
    <div class="selector-group wide">
        <span class="selector-label">Class type</span>
        <div class="selector-checks grid">
            {% for ct in class_types %}
            <label class="selector-check">
                <input type="checkbox"
                       name="class_type_selector"
                       value="{{ ct.value }}"
                       {% if ct.checked %}checked{% endif %}>
                {{ ct.label }}
            </label>
            {% endfor %}
        </div>
    </div>

    <!-- Actions -->
    <div class="selector-actions stacked">
        <button
            class="btn-tiny"
            data-open-modal="addClassModal"
        >
            + Add Class
        </button>

        <div class="selector-actions">
            <button class="btn-tiny" data-action="apply">
                Apply filters
            </button>

            <button class="btn-tiny" data-action="reset-system" type="button">
                Reset system filters
            </button>

            <button class="btn-tiny ghost-btn" data-action="reset-personal" type="button">
                Reset personal filters
            </button>
        </div>
    </div>

</section>
