<!-- templates/partials/modals/class_modal.html -->
<div class="modal-overlay hidden" data-modal-class="active" id="addClassModal">
  <div class="modal card">
    <h2 id="classModalTitle">Add Class</h2>
    <form id="classForm" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" id="classFormMethod" name="_method" value="POST">

      <label for="class-name" class="input-label">Class Name</label>
      <input id="class-name" type="text" name="class_name" class="input-field" required>

      <label for="class-code" class="input-label">Class Code</label>
      <input id="class-code" type="text" name="class_code" class="input-field" placeholder="e.g. MATH101" required>

      <label for="classTypeSelect" class="input-label">Class Type</label>
      <select id="classTypeSelect" name="class_type" class="input-field" required>
        <option value="">Select Class Type</option>
        <option value="math">Math</option>
        <option value="science">Science</option>
        <option value="language">Language</option>
        <option value="social_science">Social Science</option>
        <option value="art">Art</option>
        <option value="engineering">Engineering</option>
        <option value="technology">Technology</option>
        <option value="finance">Finance</option>
        <option value="other">Other</option>
      </select>

      <label for="classColor" class="input-label">
        Class Color <span class="hint">(used for charts & calendar)</span>
      </label>
      <div class="color-picker-row">
        <input id="classColor" type="color" name="color" class="color-input" value="#4f46e5">
        <span class="color-preview-text">Click to choose a color</span>
      </div>

      <button type="button" class="advanced-toggle" aria-expanded="false">
        ▸ Advanced options
      </button>

      <div class="advanced-options hidden">
        <label class="input-label">Teacher Name <span class="hint-icon" data-hint="Optional. Helps you remember who teaches this class.">?</span></label>
        <input id="teacher_name" type="text" name="teacher_name" class="input-field" placeholder="e.g. Mr. Smith">

        <label class="input-label">Importance <span class="hint-icon" data-hint="Used for prioritization and analytics.">?</span></label>
        <select id="importance" name="importance" class="input-field">
          <option value="">Not set</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <label class="input-label">Difficulty <span class="hint-icon" data-hint="How hard this class feels overall.">?</span></label>
        <input id="difficulty" type="number" name="difficulty" class="input-field" min="1" max="10" placeholder="1 (easy) – 10 (very hard)">

        <label class="input-label">Pass Grade (%) <span class="hint-icon" data-hint="The minimum grade you consider passing.">?</span></label>
        <input id="pass_grade" type="number" name="pass_grade" class="input-field" min="0" max="100" step="0.1" placeholder="e.g. 60">
      </div>

      <div class="modal-actions">
        <button type="submit" class="btn full-btn" id="classModalSubmit">Create Class</button>
        <button type="button" class="btn ghost-btn" data-close-modal id="closeAddClassModal">Cancel</button>
      </div>
    </form>
  </div>
</div>
