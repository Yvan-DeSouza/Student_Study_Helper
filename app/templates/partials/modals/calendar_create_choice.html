{# templates/partials/modals/calendar_create_choice.html
   "What would you like to create?" modal.
   Opened by calendar.js when user clicks an empty cell.
   Populated with prefillDate / prefillTime from JS.
#}
<div class="modal-overlay hidden" id="calendarCreateChoiceModal">
  <div class="modal card calendar-choice-modal">

    <div class="cal-modal-header">
      <h2 class="cal-modal-title">Add to Calendar</h2>
      <button class="cal-modal-close-btn" data-close-modal type="button" aria-label="Close">&times;</button>
    </div>

    <div class="cal-modal-body">
      <p class="cal-choice-date-label">
        <span class="cal-modal-icon">📅</span>
        <span id="cal-create-choice-date" class="cal-modal-info-text"></span>
      </p>

      <div class="cal-choice-buttons">

        {# Add Assignment #}
        <button
          id="btn-create-assignment"
          class="cal-choice-btn"
          type="button"
        >
          <span class="cal-choice-icon">📝</span>
          <span class="cal-choice-label">Assignment</span>
          <span class="cal-choice-desc">Set a due date for an assignment</span>
        </button>

        {# Add Study Session #}
        <button
          id="btn-create-session"
          class="cal-choice-btn"
          type="button"
          {% if has_active_session %}
            disabled
            title="You have an active session running. End it before scheduling another."
          {% endif %}
        >
          <span class="cal-choice-icon">📚</span>
          <span class="cal-choice-label">Study Session</span>
          {% if has_active_session %}
            <span class="cal-choice-desc cal-choice-desc-disabled">Session already active</span>
          {% else %}
            <span class="cal-choice-desc">Schedule a study session</span>
          {% endif %}
        </button>

      </div>
    </div>

  </div>
</div>
