<!-- templates/partials/modals/add_class.html -->
<div class="modal-overlay hidden" id="addClassModal">
  <div class="modal card">
    <h2 id="classModalTitle">Add Class</h2>
    <form id="addClassForm" method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input type="hidden" id="classFormMethod" name="_method" value="POST">

      <label class="input-label">Class Name</label>
      <input id="class-name" name="class_name" type="text" class="input-field" required>

      <label class="input-label">Class Code</label>
      <input id="class-code" name="class_code" type="text" class="input-field" required>

      <label class="input-label">Class Type</label>
      <select id="classTypeSelect" name="class_type" class="input-field" required>
        {% include "partials/forms/class_type_options.html" %}
      </select>

      <label class="input-label">Class Color</label>
      <input id="classColor" name="color" type="color" value="#4f46e5">
      <br>
      <button type="button" class="advanced-toggle" aria-expanded="false">
        ▸ Advanced options
      </button>
      <div class="advanced-options hidden">
        <label class="input-label">Teacher Name</label>
        <input id="teacher_name" name="teacher_name" type="text" class="input-field">

        <label class="input-label">Importance</label>
        <select id="importance" name="importance" class="input-field">
          <option value="">Not set</option>
          <option value="high">High</option>
          <option value="medium">Medium</option>
          <option value="low">Low</option>
        </select>

        <label class="input-label">Difficulty</label>
        <input id="difficulty" name="difficulty" type="number" min="1" max="10" class="input-field">

        <label class="input-label">Pass Grade (%)</label>
        <input id="pass_grade" name="pass_grade" type="number" min="0" max="100" step="0.1" class="input-field">
      </div>

      <div class="modal-actions">
        <button type="submit" id="classModalSubmit" class="btn full-btn">Create Class</button>
        <button type="button" class="btn ghost-btn" data-close-modal>Cancel</button>
      </div>
    </form>
  </div>
</div>
