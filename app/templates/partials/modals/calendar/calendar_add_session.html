{# templates/partials/modals/calendar_add_session.html
   Schedule a new study session directly from the calendar.
   Class + assignment dropdowns populated via JS (/api/calendar/classes, /api/calendar/assignments).
   Submits to POST /api/calendar/sessions via calendar.js.
#}
<div class="modal-overlay hidden" id="calendarAddSessionModal">
  <div class="modal card">

    <h2>Schedule Study Session</h2>

    <form id="calendarAddSessionForm">
      <input type="hidden" name="csrf_token"   value="{{ csrf_token() }}">
      <input type="hidden" name="start_option" value="later">

      <label for="cal-add-session-class" class="input-label">Class <span class="required-star">*</span></label>
      <select id="cal-add-session-class" name="class_id" class="input-field" required>
        <option value="">Select a class</option>
          {% for c in classes %}
              <option value="{{ c.class_id }}">{{ c.class_name }}</option>
          {% endfor %}
      </select>

      <label for="cal-add-session-title" class="input-label">Session Title <span class="required-star">*</span></label>
      <input
        id="cal-add-session-title"
        type="text"
        name="title"
        class="input-field"
        placeholder="e.g. Calculus practice"
        required
      >

      <label for="cal-add-session-type" class="input-label">Session Type <span class="required-star">*</span></label>
      <select id="cal-add-session-type" name="session_type" class="input-field" required>
        <option value="homework">Homework</option>
        <option value="project">Project</option>
        <option value="quiz">Quiz</option>
        <option value="writing">Writing</option>
        <option value="test">Test</option>
        <option value="exam">Exam</option>
        <option value="lab_report">Lab Report</option>
        <option value="presentation">Presentation</option>
        <option value="reading">Reading</option>
        <option value="other">Other</option>
      </select>

      <label for="cal-add-sched-start" class="input-label">Scheduled Start <span class="required-star">*</span></label>
      <input
        id="cal-add-sched-start"
        type="datetime-local"
        name="scheduled_start_at"
        class="input-field"
        required
      >

      <label for="cal-add-sched-end" class="input-label">
        Scheduled End <span class="hint">(optional)</span>
      </label>
      <input
        id="cal-add-sched-end"
        type="datetime-local"
        name="scheduled_end_at"
        class="input-field"
      >

      <label for="cal-add-session-assignment" class="input-label">
        Assignment <span class="hint">(optional)</span>
      </label>
      <select id="cal-add-session-assignment" name="assignment_id" class="input-field">
        <option value="">None</option>
      </select>

      <label for="cal-add-session-duration" class="input-label">
        Expected Duration <span class="hint">(minutes, optional)</span>
      </label>
      <input
        id="cal-add-session-duration"
        type="number"
        name="expected_duration_minutes"
        class="input-field"
        min="1"
        placeholder="e.g. 60"
      >

      <div class="modal-actions">
        <button type="submit"  class="btn full-btn">Schedule Session</button>
        <button type="button"  class="btn ghost-btn" data-close-modal>Cancel</button>
      </div>

    </form>

  </div>
</div>
