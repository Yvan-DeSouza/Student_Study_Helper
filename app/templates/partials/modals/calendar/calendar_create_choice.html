{# templates/partials/modals/calendar_create_choice.html
   "What would you like to add?" choice modal.
   Opened by calendar.js when the user clicks an empty cell.
   The session button is disabled server-side when has_active_session is True.
#}
<div class="modal-overlay hidden" id="calendarCreateChoiceModal">
  <div class="modal card cal-choice-modal">

    <div class="cal-modal-header">
      <div>
        <h2 class="cal-modal-title">Add to Calendar</h2>
        <p class="cal-choice-date" id="cal-create-choice-date"></p>
      </div>
      <button class="cal-modal-close-btn" data-close-modal type="button" aria-label="Close">&times;</button>
    </div>

    <div class="cal-modal-body cal-choice-body">

      <button id="btn-create-assignment" class="cal-choice-btn" type="button">
        <span class="cal-choice-icon">📝</span>
        <div class="cal-choice-text">
          <span class="cal-choice-label">Assignment</span>
          <span class="cal-choice-desc">Set a due date or log an assignment</span>
        </div>
        <span class="cal-choice-arrow">›</span>
      </button>

      <button
        id="btn-create-session"
        class="cal-choice-btn"
        type="button"
        {% if has_active_session %}disabled title="You have an active session. End it before scheduling another."{% endif %}
      >
        <span class="cal-choice-icon">📚</span>
        <div class="cal-choice-text">
          <span class="cal-choice-label">Study Session</span>
          {% if has_active_session %}
            <span class="cal-choice-desc cal-choice-desc-warn">A session is currently active</span>
          {% else %}
            <span class="cal-choice-desc">Schedule a study session</span>
          {% endif %}
        </div>
        <span class="cal-choice-arrow">›</span>
      </button>

    </div>

  </div>
</div>
