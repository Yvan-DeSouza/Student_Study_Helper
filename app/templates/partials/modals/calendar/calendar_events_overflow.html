{# templates/partials/modals/calendar_events_overflow.html
   Shows events hidden by the "+N more" overflow indicator.
   Built and controlled by calendar_overflow_modal.js.
   Clicking any item closes this and opens the event details modal.
#}
<div class="modal-overlay hidden" id="calendarEventsOverflowModal">
  <div class="modal card cal-overflow-modal">

    <div class="cal-modal-header">
      <h2 class="cal-modal-title">
        Events &mdash; <span id="overflow-modal-label" class="overflow-label-accent"></span>
      </h2>
      <button class="cal-modal-close-btn" data-close-modal type="button" aria-label="Close">&times;</button>
    </div>

    <div class="cal-modal-body">
      <div id="overflow-modal-list" class="overflow-event-list"></div>
    </div>

    <div class="cal-modal-actions">
      <button class="btn ghost-btn" data-close-modal type="button">Close</button>
    </div>

  </div>
</div>
